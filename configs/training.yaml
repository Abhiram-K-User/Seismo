# Training configuration.
# Phase 3 Baseline 1 training setup.
# The random seed lives in config.yaml (single source).

device: auto        # auto | cpu | cuda
num_workers: 0

batch_size: 16
max_epochs: 30

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001

scheduler:
  name: cosine

early_stopping:
  monitor: macro_f1
  patience: 7

loss:
  name: cross_entropy          # cross_entropy (softmax baselines) | evidential (Phase 8)
  evidential:         # Phase 8 — formulation not chosen yet
    variant: null
    kl_annealing_epochs: null
    kl_weight: null

class_weighting: null # decide after inspecting the class distribution (Phase 1)

checkpoint:
  monitor: macro_f1
  save_last: true

logging:
  level: INFO
  log_every_n_steps: 10
