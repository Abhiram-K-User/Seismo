# The random seed lives in config.yaml (single source).

device: auto        # auto | cpu | cuda
num_workers: 0

batch_size: null
max_epochs: null

optimizer:
  name: null
  lr: null
  weight_decay: null

scheduler:
  name: null

early_stopping:
  monitor: null
  patience: null

loss:
  name: null          # cross_entropy (softmax baselines) | evidential (Phase 8)
