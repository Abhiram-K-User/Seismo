# Model configuration.
# Baseline 1 (Phase 3): 1D CNN waveform encoder + mean station pooling + softmax head.
# Baseline 3 (Phase 6): 1D CNN encoder + GATv2 spatial graph attention + attention pooling + softmax head.

num_classes: 2

encoder:                          # Stage A — Phase 3 (waveform), Phase 4 (spectrogram)
  type: cnn
  in_channels: 3
  input_representation: waveform  # waveform | spectrogram
  embedding_dim: 128

station_pooling: attention        # mean | max | attention

graph:                            # Stage B — Phase 5 (static), Phase 7 (dynamic)
  enabled: false
  type: spatial                   # spatial | waveform_similarity | dynamic
  spatial:
    method: knn                   # knn | radius | gaussian_kernel | fully_connected
    k_neighbors: 5
    radius_km: 150.0
    sigma_km: 50.0
  waveform_similarity:
    method: cosine                # cosine | xcorr
    max_lag_s: 2.0
  alpha: 1.0
  beta: 0.0

gat:                              # Stage C — Phase 6
  enabled: false
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.1

stgnn:                            # Stage D — Phase 7
  enabled: false
  hidden_dim: null
  num_layers: null
  dropout: null

head:                             # Stage E — softmax (Phase 3) / evidential (Phase 8)
  type: softmax                   # softmax | evidential
  evidence_activation: null       # relu | softplus | exp (evidential only)
